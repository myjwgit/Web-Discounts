name: Test and Deploy Frontend

on:
  push:
    branches: [main,twochatbot]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static files exist
        run: |
          test -f FrontEnd/html/index.html
          test -f FrontEnd/html/css/style.css
          test -f FrontEnd/html/scripts/app.js

      - name: Smoke test chatbot markup
        run: |
          grep -q 'chatbotTrigger' FrontEnd/html/index.html
          grep -q 'chatbotPanel' FrontEnd/html/index.html
          grep -q 'NAVIGATION CHATBOT' FrontEnd/html/scripts/app.js

      - name: Start local static server
        run: |
          cd FrontEnd/html
          python3 -m http.server 8000 > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          sleep 2

      - name: Check homepage response
        run: |
          curl -I http://127.0.0.1:8000/index.html
          curl -s http://127.0.0.1:8000/index.html | grep -q 'StudentHelper Navigator'

      - name: Stop local server
        if: always()
        run: |
          kill $(cat /tmp/server.pid) || true

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: FrontEnd/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
