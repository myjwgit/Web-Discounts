version: '3.9'
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      DB_PROVIDER: ${DB_PROVIDER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
    restart: unless-stopped
